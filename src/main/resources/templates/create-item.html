<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create New Item</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script th:replace="~{fragments/tailwind :: tailwind-config}"></script>
</head>
<body class="bg-apple-gray min-h-screen">
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    <div th:if="${message}" class="max-w-7xl mx-auto px-4 py-2 mt-24">
        <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative" role="alert">
            <span class="block sm:inline" th:text="${message}"></span>
        </div>
    </div>
    
    <div th:if="${error}" class="max-w-7xl mx-auto px-4 py-2 mt-24">
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert">
            <span class="block sm:inline" th:text="${error}"></span>
        </div>
    </div>
    <div class="pt-32 max-w-7xl mx-auto px-4 py-8">        
        <div class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4">
            <h2 class="text-2xl font-bold mb-6">Create New Item</h2>
            <form th:action="@{/post-item}" method="post">
                <div class="space-y-4">
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Item Name</label>
                        <input type="text" name="name" required class="shadow appearance-none border rounded w-full py-2 px-3">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Weight (kg)</label>
                        <input type="number" step="0.01" name="weight" required class="shadow appearance-none border rounded w-full py-2 px-3">
                    </div>
                    <button type="submit" class="bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 text-white px-4 py-2 rounded transition duration-300 ease-in-out transform hover:-translate-y-0.5 hover:shadow-lg">Create Item</button>
                </div>
            </form>
        </div>
        <div class="overflow-x-auto">
            <table class="min-w-full">
                <thead>
                    <tr class="bg-gray-100">
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Code</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Weight</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                    <tr th:each="item : ${allItems}">
                        <td class="px-6 py-4 whitespace-nowrap" th:text="${item.name}"></td>
                        <td class="px-6 py-4 whitespace-nowrap" th:text="${item.code}"></td>
                        <td class="px-6 py-4 whitespace-nowrap" th:text="${item.weight}"></td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <form th:action="@{/api/v1/item/delete/{id}(id=${item.id})}" method="post">
                                <input type="hidden" name="_method" value="delete" />
                                <button type="submit" class="bg-red-500 text-white px-2 py-1 rounded hover:bg-red-600">
                                    Delete
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
