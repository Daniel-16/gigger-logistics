<!DOCTYPE html>

                <div class="flex items-center">
                    <span class="text-2xl font-semibold animate-gradient bg-gradient-to-r from-apple-text via-apple-accent to-apple-text bg-300% bg-clip-text text-transparent animate-text">
                        gigger

                </div>
                
                <div class="hidden md:flex items-center space-x-8">
